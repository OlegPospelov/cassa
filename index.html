<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Касса</title>
<style>
  body {
    margin: 0;
    background: #0b0b0b;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .cassa-container {
    position: relative;
    max-width: 1300px;
    width: 100%;
  }
  .cassa-container img {
    width: 100%;
    display: block;
    height: auto;
  }
  .hotspot {
    position: absolute;
    background: rgba(0, 0, 0, 0.95);
    border: 2px solid red;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="cassa-container">
  <img src="00.png" alt="Касса">
  <div class="hotspot" style="top: 35%; left: 35%; width: 30%; height: 30%;"></div>
</div>
</body>
</html>
