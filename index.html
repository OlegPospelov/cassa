<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Касса</title>
<style>
  body {
    margin: 0;
    background: #0b0b0b;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .cassa-container {
    position: relative;
    max-width: 1300px;
    width: 100%;
  }
  .cassa-container img {
    width: 100%;
    display: block;
    height: auto;
  }
  /* Накладываем SVG прямо поверх картинки с точными пропорциями viewBox */
  .cassa-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .hotspot {
    fill: rgba(0, 0, 0, 0.95);
    stroke: red;
    stroke-width: 2;
    cursor: pointer;
    transition: fill 0.2s;
  }
  .hotspot:hover {
    fill: rgba(255, 255, 255, 0.25);
  }
</style>
</head>
<body>
<div class="cassa-container">
  <img src="00.png" alt="Касса">
  <!-- viewBox подбирается под реальное разрешение исходной картинки 00.png в пикселях -->
  <svg class="cassa-svg" viewBox="0 0 1200 800">
    <rect class="hotspot" x="400" y="250" width="300" height="300" />
  </svg>
</div>
</body>
</html>
