<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Касса</title>
<style>
  body {
    margin: 0;
    background: #0b0b0b;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .cassa-container {
    position: relative;
    max-width: 1300px;
    width: 100%;
  }
  .cassa-container img {
    width: 100%;
    display: block;
    height: auto;
  }
  .tooltip-box {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    color: #1a1a1a;
    padding: 10px 20px;
    border-radius: 8px;
    font-family: sans-serif;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: none;
    z-index: 100;
  }
</style>
</head>
<body>

<div class="cassa-container">
  <img src="00.png" alt="Касса" usemap="#cassa-map">
  
  <map name="cassa-map">
    <!-- Пример тестовой зоны (координаты полигона x1,y1, x2,y2...) -->
    <area shape="rect" coords="420,290,675,570" href="#" alt="Центральный блок" data-title="Черный квадрат из теста">
  </map>
</div>

<div class="tooltip-box" id="tooltip"></div>

<script>
  const areas = document.querySelectorAll('area');
  const tooltip = document.getElementById('tooltip');

  areas.forEach(area => {
    area.addEventListener('mouseenter', (e) => {
      tooltip.textContent = area.dataset.title;
      tooltip.style.display = 'block';
    });
    area.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
    });
  });
</script>

</body>
</html>
