<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Касса</title>
<style>
  body {
    margin: 0;
    background: #0b0b0b;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .cassa-container {
    position: relative;
    max-width: 1300px;
    width: 100%;
  }
  .cassa-container img {
    width: 100%;
    display: block;
    height: auto;
  }
  /* Вешаем сетку прямо на сам элемент изображения через CSS Grid */
  .cassa-grid {
    position: absolute;
    top: 20.3%;
    left: 14.1%;
    width: 77.4%;
    height: 72.3%;
    display: grid;
    grid-template-columns: repeat(16, 1fr);
    grid-template-rows: repeat(14, 1fr);
  }
  .cell {
    background: rgba(0, 0, 0, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.5);
    cursor: pointer;
    transition: background 0.2s;
  }
  .cell:hover {
    background: rgba(255, 255, 255, 0.2);
  }
</style>
</head>
<body>

<div class="cassa-container">
  <img src="00.png" alt="Касса">
  
  <div class="cassa-grid">
    <!-- Тестируем одну ячейку по сетке кассы -->
    <div class="cell" style="grid-column: 4 / span 2; grid-row: 2 / span 2;"></div>
  </div>
</div>

</body>
</html>
