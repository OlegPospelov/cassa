<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Интерактивная касса типографского набора</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        .hotspot {
            cursor: pointer;
            fill: transparent;
            stroke: none;
            transition: fill 0.2s ease;
            touch-action: manipulation;
        }
        .hotspot:hover {
            fill: rgba(255, 255, 255, 0.08);
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }
        .pulse-marker {
            z-index: 1;
        }
        .pulse-marker::before {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: inherit;
            animation: pulse-ring 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
            pointer-events: none;
        }
        @media (prefers-reduced-motion: reduce) {
            .pulse-marker::before {
                animation: none;
            }
        }
        #viewport {
            transform-origin: 0 0;
            cursor: grab;
            position: absolute;
            left: 0;
            top: 0;
            width: 3000px;
            height: 2077px;
        }
        #viewport:active {
            cursor: grabbing;
        }
        #workspace {
            touch-action: manipulation;
        }
        #tooltip {
            width: min(20rem, calc(100vw - 24px));
            max-width: calc(100vw - 24px);
            box-sizing: border-box;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        @media (max-width: 640px) {
            #tooltip {
                width: 280px;
                max-width: calc(100vw - 24px);
                padding: 12px;
                border-radius: 12px;
            }
            #tooltip-title {
                font-size: 14px;
                line-height: 1.25;
            }
            #tooltip-desc {
                font-size: 12px;
                line-height: 1.4;
            }
        }
    </style>
</head>

    <div id="tooltip" class="fixed pointer-events-none opacity-0 transition-opacity duration-200 z-50 bg-black text-white px-4 py-3 rounded-xl shadow-2xl border border-zinc-800 backdrop-blur-md max-w-xs transform -translate-x-1/2 -translate-y-full mb-3">
        <div id="tooltip-title" class="font-bold text-sm text-orange-500 mb-1"></div>
        <div id="tooltip-desc" class="text-xs text-zinc-300 leading-relaxed"></div>
        <div class="absolute left-1/2 -bottom-1.5 transform -translate-x-1/2 w-3 h-3 bg-black border-r border-b border-zinc-800 rotate-45"></div>
    </div>

    <script>
        const workspace = document.getElementById('workspace');
        const viewport = document.getElementById('viewport');
        const tooltip = document.getElementById('tooltip');
        const tooltipTitle = document.getElementById('tooltip-title');
        const tooltipDesc = document.getElementById('tooltip-desc');
        const hotspots = document.querySelectorAll('.hotspot');

        let scale = 1;
        let panning = false;
        let startX = 0;
        let startY = 0;
        let translateX = 0;
        let translateY = 0;
        let activeHotspot = null;

        function updateTransform() {
            viewport.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
            if (activeHotspot) {
                positionTooltip(activeHotspot);
            }
        }

        function initCenter() {
            const containerW = workspace.clientWidth;
            const containerH = workspace.clientHeight;
            scale = Math.min(containerW / 3000, containerH / 2077) * 0.95;
            translateX = (containerW - 3000 * scale) / 2;
            translateY = (containerH - 2077 * scale) / 2;
            updateTransform();
        }

        window.addEventListener('load', initCenter);
        window.addEventListener('resize', initCenter);

        workspace.addEventListener('mousedown', (e) => {
            panning = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!panning) return;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            panning = false;
        });

        workspace.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.1;
            const oldScale = scale;
            if (e.deltaY < 0) {
                scale = Math.min(scale * zoomFactor, 4);
            } else {
                scale = Math.max(scale / zoomFactor, 0.15);
            }

            const rect = workspace.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            translateX = mouseX - (mouseX - translateX) * (scale / oldScale);
            translateY = mouseY - (mouseY - translateY) * (scale / oldScale);
            updateTransform();
        }, { passive: false });

        function positionTooltip(hotspot) {
            const rect = hotspot.getBoundingClientRect();
            const padding = 12;
            const gap = 12;

            tooltip.style.transform = 'none';
            tooltip.classList.remove('opacity-0');

            const tooltipRect = tooltip.getBoundingClientRect();
            const x = Math.min(
                Math.max(rect.left + rect.width / 2, padding + tooltipRect.width / 2),
                window.innerWidth - padding - tooltipRect.width / 2
            );
            const aboveY = rect.top - tooltipRect.height - gap;
            const y = aboveY >= padding
                ? aboveY
                : Math.min(rect.bottom + gap, window.innerHeight - padding - tooltipRect.height);

            tooltip.style.left = `${x - tooltipRect.width / 2}px`;
            tooltip.style.top = `${Math.max(padding, y)}px`;
        }

        function showTooltip(e, title, desc) {
            activeHotspot = e.currentTarget;
            tooltipTitle.textContent = title;
            tooltipDesc.textContent = desc;
            positionTooltip(activeHotspot);
        }

        function hideTooltip() {
            activeHotspot = null;
            tooltip.classList.add('opacity-0');
        }

        const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

        hotspots.forEach(hotspot => {
            const title = hotspot.getAttribute('data-title');
            const desc = hotspot.getAttribute('data-desc');

            if (canHover) {
                hotspot.addEventListener('mouseenter', (e) => showTooltip(e, title, desc));
                hotspot.addEventListener('mouseleave', hideTooltip);
            }

            hotspot.addEventListener('click', (e) => {
                e.stopPropagation();
                if (tooltip.classList.contains('opacity-0')) {
                    showTooltip(e, title, desc);
                } else {
                    hideTooltip();
                }
            });
        });

        document.addEventListener('click', () => {
            hideTooltip();
        });
    </script>
