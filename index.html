<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Касса</title>
<style>
  body {
    margin: 0;
    background: #0b0b0b;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .cassa-container {
    position: relative;
    max-width: 1300px;
    width: 100%;
  }
  .cassa-container img {
    width: 100%;
    display: block;
    height: auto;
  }
  .grid-overlay {
    position: absolute;
    /* Наложи точные проценты рамки самой кассы внутри картинки */
    top: 20.3%; 
    left: 14.1%; 
    width: 77.5%; 
    height: 72.5%;
    display: grid;
    grid-template-columns: repeat(16, 1fr);
    grid-template-rows: repeat(8, 1fr);
  }
  .cell {
    background: transparent;
    cursor: pointer;
    transition: background 0.2s;
  }
  .cell:hover {
    background: rgba(255, 255, 255, 0.18);
  }
</style>
</head>
<body>
<div class="cassa-container">
  <img src="00.png" alt="Касса">
  <div class="grid-overlay">
    <div class="cell" style="grid-column: 1 / span 2; grid-row: 1;"></div>
  </div>
</div>
</body>
</html>
