<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Касса</title>
<style>
  body {
    margin: 0;
    background: #0b0b0b;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .cassa-container {
    position: relative;
    max-width: 1300px;
    width: 100%;
  }
  .cassa-container img {
    width: 100%;
    display: block;
    height: auto;
  }
  .cassa-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .hotspot {
    fill: rgba(0, 0, 0, 0.4);
    stroke: rgba(255, 255, 255, 0.8);
    stroke-width: 3;
    cursor: pointer;
    pointer-events: auto;
    transition: fill 0.2s;
  }
  .hotspot:hover {
    fill: rgba(255, 255, 255, 0.18);
  }
  .tooltip {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffffff;
    color: #1a1a1a;
    padding: 10px 20px;
    border-radius: 8px;
    font-family: sans-serif;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: none;
    z-index: 100;
  }
</style>
</head>
<body>

<div class="cassa-container">
  <img src="00.png" alt="Касса">
  
  <svg class="cassa-svg" viewBox="0 0 3000 2077" preserveAspectRatio="none">
    <!-- Ячейки с обводкой для видимости -->
    <rect class="hotspot" x="2573" y="1465" width="102" height="109" data-title="Ячейка 1" />
    <rect class="hotspot" x="914" y="728" width="120" height="114" data-title="Ячейка 2" />
    <rect class="hotspot" x="1298" y="410" width="117" height="108" data-title="Ячейка 3" />
    <rect class="hotspot" x="884" y="1187" width="116" height="105" data-title="Ячейка 4" />
    <rect class="hotspot" x="2649" y="1877" width="246" height="239" data-title="Ячейка 5" />
  </svg>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
  const hotspots = document.querySelectorAll('.hotspot');
  const tooltip = document.getElementById('tooltip');

  hotspots.forEach(spot => {
    spot.addEventListener('mouseenter', () => {
      tooltip.textContent = spot.dataset.title;
      tooltip.style.display = 'block';
    });
    spot.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
    });
  });
</script>

</body>
</html>
